- id: discovery-news-events
  name: GDELT AI safety organization and funding query
  url: https://api.gdeltproject.org/api/v2/doc/doc?query=%22AI%20safety%22%20%28launches%20OR%20founded%20OR%20funding%20OR%20grant%20OR%20evaluation%20OR%20audit%29&mode=artlist&maxrecords=100&format=json&sort=datedesc
  kind: news-gdelt
  inclusion_hint: unknown
  include_title_pattern: '(launch|found|new .*(lab|institute|organization|centre|center)|fund|grant|acquir|merg|clos|shut|appoint|director|ceo|evaluation|audit|partnership|collaborat|sponsor)'
  notes: Event leads only; never creates organization candidates or material claims directly. Broad news noise is expected.

